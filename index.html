<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP HACKERX SENSI ENGINE v4.0</title>
    <!-- Premium Gaming Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070f;
            --panel-bg: #0d1222;
            --neon-red: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffea00;
            --text-white: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            background-image: 
                radial-gradient(at 50% 0%, rgba(255, 0, 85, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 243, 255, 0.1) 0px, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
            letter-spacing: 0.5px;
        }

        header {
            text-align: center;
            padding: 40px 15px;
            border-bottom: 2px dashed rgba(0, 243, 255, 0.3);
            background: rgba(13, 18, 34, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red);
            letter-spacing: 3px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-top: 8px;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .panel-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .panel-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-cyan));
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-yellow);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--neon-yellow);
            padding-left: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        select {
            padding: 14px;
            background: #060916;
            border: 1px solid #1e294b;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-inject {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--neon-red), #cc0044);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            transition: 0.3s;
        }

        .btn-inject:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--neon-red);
        }

        .loader-wrapper {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-yellow);
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #060916;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1e294b;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow));
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .results-box {
            display: none;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            animation: panelFade 0.4s ease-out;
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #1e294b;
        }

        .output-row:last-child { border: none; }

        .output-info h4 {
            margin: 0;
            font-size: 1.2rem;
            color: #fff;
        }

        .output-info p {
            margin: 3px 0 0 0;
            font-size: 0.9rem;
            color: #64748b;
        }

        .value-action {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .val-display {
            background: #060916;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            padding: 6px 14px;
            border-radius: 6px;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .btn-copy {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-copy:hover {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
        }

        .regedit-block {
            background: #02040a;
            border: 1px dashed var(--neon-yellow);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: var(--neon-yellow);
            font-size: 0.9rem;
            margin-top: 15px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .trick-card {
            background: #0b0f23;
            border-left: 4px solid var(--neon-red);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .trick-card h5 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .trick-card p {
            margin: 0;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
